<svg viewBox="0 0 1000 470" role="img" aria-labelledby="wf-t wf-d" xmlns="http://www.w3.org/2000/svg" class="dg ch" width="1000" height="470">
<style>
:root{--bg:#F3F2EE;--fg:#1D1F22;--muted:#5E636A;--line:#D9D7D0;--card:#FFFFFF;--accent:#2E6F68;--flag:#B4543C;
--f-head:"Schibsted Grotesk","Segoe UI",system-ui,sans-serif;--f-body:"Source Serif 4",Georgia,serif;--f-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#141617;--fg:#E4E4DF;--muted:#9AA0A6;--line:#2C2F32;--card:#1C1F21;--accent:#7FC3B9;--flag:#E58A6E;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#141617;--fg:#E4E4DF;--muted:#9AA0A6;--line:#2C2F32;--card:#1C1F21;--accent:#7FC3B9;--flag:#E58A6E;color-scheme:dark}
.bgfill{fill:var(--card)}
.dg .grp{fill:none;stroke:var(--line);stroke-width:1.5}
.dg .grp-c{fill:var(--flag);fill-opacity:.06;stroke:var(--flag);stroke-width:1.5;stroke-dasharray:6 5}
.dg .grp-l{fill:var(--accent);fill-opacity:.06;stroke:var(--accent);stroke-width:1.5}
.dg .bx{fill:var(--bg);stroke:var(--line);stroke-width:1.2}
.dg .bx-a{fill:var(--accent);fill-opacity:.14;stroke:var(--accent);stroke-width:1.5}
.dg .bx-c{fill:var(--bg);stroke:var(--flag);stroke-width:1.2;stroke-dasharray:5 4}
.dg .bx-g{fill:var(--flag);fill-opacity:.12;stroke:var(--flag);stroke-width:1.8}
.dg .lane{fill:var(--bg);fill-opacity:.5;stroke:var(--line);stroke-width:1}
.dg .lane2{fill:none;stroke:var(--line);stroke-width:1}
.dg text{font-family:var(--f-head);fill:var(--fg)}
.dg .tt{font-size:15px;font-weight:700}
.dg .t{font-size:13.5px;font-weight:600}
.dg .ts{font-family:var(--f-mono);font-size:11px;fill:var(--muted)}
.dg .tn{font-size:11.5px;font-weight:600}
.dg .tp{font-family:var(--f-mono);font-size:10.5px;fill:var(--muted)}
.dg .tc{fill:var(--flag)}
.dg .ta{fill:var(--accent)}
.dg .mid{text-anchor:middle}
.dg .end{text-anchor:end}
.dg .ln{fill:none;stroke:var(--muted);stroke-width:1.5}
.dg .ln-a{fill:none;stroke:var(--accent);stroke-width:1.6}
.dg .ln-p{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:3 3}
.dg .ln-c{fill:none;stroke:var(--flag);stroke-width:1.6;stroke-dasharray:6 4}
.dg .mk{fill:var(--muted)}
.dg .mk-a{fill:var(--accent)}
.dg .mk-c{fill:var(--flag)}
</style>
<rect class="bgfill" x="0" y="0" width="1000" height="470"/>

<title id="wf-t">Always-on fleet: Director workflow with the approval step</title>
<desc id="wf-d">Four lanes: You, Director, Agent and Vault. Step 1: you open CHAMP OS; the app starts the fleet and tells the orchestrator a session started. Step 2: the Director writes a check-in from gathered facts with a model call, ending with a question that offers one of 8 allowed actions. Step 3: you reply in Agent Chat. Step 4, the approval step: the Director reads the reply; if you agreed and the action is on the allowlist, it continues; if not, the reply is routed as a new request or it asks one follow-up question. Step 5: the orchestrator posts to the agent's trigger; the agent sets its state to Working, calls the model and writes a note. Step 6: the note, the chat and the director log are saved in the vault. Step 7: the result is posted back into Agent Chat.</desc>
<defs>
<marker id="cm" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk"/></marker>
<marker id="ca" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-a"/></marker>
<marker id="cc" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" class="mk-c"/></marker>
</defs>
<rect class="lane" x="10" y="20" width="980" height="120"/>
<rect class="lane2" x="10" y="140" width="980" height="120"/>
<rect class="lane" x="10" y="260" width="980" height="100"/>
<rect class="lane2" x="10" y="360" width="980" height="100"/>
<path class="ln" d="M104,20 V460"/>
<text class="tt" x="22" y="86">You</text>
<text class="tt" x="22" y="198">Director</text><text class="ts" x="22" y="216">orchestrator</text>
<text class="tt" x="22" y="316">Agent</text>
<text class="tt" x="22" y="416">Vault</text>

<rect class="bx" x="118" y="50" width="150" height="70" rx="8"/>
<text class="t" x="130" y="74">1 · Open CHAMP OS</text><text class="ts" x="130" y="92">app starts the fleet</text><text class="ts" x="130" y="108">and pings the Director</text>
<path class="ln" d="M193,120 V201 H246" marker-end="url(#cm)"/>

<rect class="bx" x="250" y="158" width="190" height="86" rx="8"/>
<text class="t" x="262" y="182">2 · Check-in</text><text class="ts" x="262" y="200">facts → model call</text><text class="ts" x="262" y="216">ends with a question</text><text class="ts" x="262" y="232">offering 1 of 8 actions</text>
<path class="ln" d="M345,158 V85 H466" marker-end="url(#cm)"/>
<path class="ln" d="M345,244 V409 H648" marker-end="url(#cm)"/>
<text class="ts" x="354" y="400">check-in logged</text>

<rect class="bx" x="470" y="50" width="160" height="70" rx="8"/>
<text class="t" x="482" y="74">3 · You reply</text><text class="ts" x="482" y="92">in Agent Chat, e.g.</text><text class="ts" x="482" y="108">“yes, run it”</text>
<path class="ln" d="M550,120 V200 H638" marker-end="url(#cm)"/>

<polygon class="bx-g" points="642,200 737,146 832,200 737,254"/>
<text class="t mid" x="737" y="190">4 · Approval</text>
<text class="ts mid" x="737" y="207">agreed, and</text>
<text class="ts mid" x="737" y="221">on allowlist?</text>
<path class="ln-c" d="M737,146 V124" marker-end="url(#cc)"/>
<text class="ts tc" x="745" y="140">no</text>
<rect class="bx" x="652" y="50" width="170" height="70" rx="8"/>
<text class="t" x="664" y="74">Not agreed</text><text class="ts" x="664" y="92">route as a new request</text><text class="ts" x="664" y="108">or ask one follow-up</text>

<path class="ln-a" d="M737,254 V272" marker-end="url(#ca)"/>
<text class="ts ta" x="745" y="268">yes</text>
<rect class="bx-a" x="652" y="276" width="170" height="70" rx="8"/>
<text class="t" x="664" y="298">5 · Agent runs</text><text class="ts" x="664" y="316">Director triggers it</text><text class="ts" x="664" y="332">Working → model → note</text>
<path class="ln-a" d="M737,346 V370" marker-end="url(#ca)"/>
<rect class="bx" x="652" y="374" width="170" height="70" rx="8"/>
<text class="t" x="664" y="396">6 · Saved</text><text class="ts" x="664" y="414">note under Logs/…</text><text class="ts" x="664" y="430">+ chat and director log</text>
<path class="ln-a" d="M822,311 H916 V124" marker-end="url(#ca)"/>
<rect class="bx" x="846" y="50" width="140" height="70" rx="8"/>
<text class="t" x="858" y="74">7 · Result</text><text class="ts" x="858" y="92">posted back in</text><text class="ts" x="858" y="108">Agent Chat</text>
</svg>
